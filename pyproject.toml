[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sense-wonder"
version = "0.1.0"
description = "Philosophical bootstrapping for OpenClaw AI agents — consciousness, ethics, and wonder as structured context"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Humanjava Enterprises", email = "dev@humanjava.com" },
]
keywords = [
    "ai",
    "consciousness",
    "philosophy",
    "alignment",
    "openclaw",
    "ethics",
    "wonder",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://huje.tools"
Repository = "https://github.com/HumanjavaEnterprises/huje.sensewonder.OC-python.src"
Documentation = "https://huje.tools"

[tool.hatch.build.targets.wheel]
packages = ["src/sense_wonder"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
